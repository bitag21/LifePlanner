<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks - LifePlanner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #333;
        }

        .navbar {
            background: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        .task {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
        }

        .task-info {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .completed {
            text-decoration: line-through;
            color: #999;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            background: #eee;
            color: #333;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="logo">🌱 LifePlanner</div>
    <a href="/">Dashboard</a>
</nav>

<div class="container">

    <h1>✅ My Tasks</h1>

    <form class="add-task" action="/tasks/add" method="post">
        <input
                type="text"
                name="title"
                placeholder="What do you need to do?"
                required>

        <button type="submit">Add Task</button>
    </form>

    <div th:each="task : ${tasks}" class="task">

        <div class="task-info">

            <span
                    th:classappend="${task.completed} ? 'completed' : ''"
                    th:text="${task.title}">
                Task
            </span>

        </div>

        <div class="actions">

            <a th:href="@{/tasks/complete/{id}(id=${task.id})}">
                <span th:if="${!task.completed}">✓</span>
                <span th:if="${task.completed}">↩</span>
            </a>

            <a th:href="@{/tasks/delete/{id}(id=${task.id})}">
                🗑
            </a>

        </div>

    </div>

</div>

</body>
</html>
